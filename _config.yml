# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
permalink: pretty
paginate: 12
exclude: ["less","node_modules","vendor","vendor/bundle",".bundle","Gruntfile.js","package.json","package-lock.json","README.md","Gemfile","Gemfile.lock"]
anchorjs: true                          # if you want to customize anchor. check out line:181 of `post.html`



# Plugins
# from PR#40, to support local preview for Jekyll 3.0
plugins:
  - jekyll-paginate




# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM                            # use Github Flavored Markdown !important



# 评论系统
# Disqus（https://disqus.com/）
# disqus_username: qiubaiying

# Giscus (GitHub Discussions-based comments, no client secret needed client-side)
# Setup:
#   1. Make this repo public, enable Discussions (repo Settings > General > Features).
#   2. Install the giscus app: https://github.com/apps/giscus
#   3. Go to https://giscus.app, fill in this repo, pick a "Announcements"-like
#      category (or create "Comments"), copy the generated repo-id/category-id below.
giscus:
  enable: false
  repo: "nabang1010/nabang1010.github.io"
  repo-id: ""        # fill in from giscus.app
  category: "Comments"
  category-id: ""    # fill in from giscus.app
  light-theme: "light"
  dark-theme: "dark"
  lang: "en"


