<div class="image-lightbox" data-image-lightbox aria-hidden="true">
    <section class="image-lightbox-dialog" role="dialog" aria-modal="true" aria-labelledby="image-lightbox-title">
        <header class="image-lightbox-toolbar">
            <div class="image-lightbox-heading">
                <span>Image preview</span>
                <strong id="image-lightbox-title" data-lightbox-title>Article image</strong>
            </div>
            <div class="image-lightbox-controls" aria-label="Image controls">
                <button type="button" data-lightbox-action="zoom-out" aria-label="Zoom out" title="Zoom out">
                    <i class="fa fa-search-minus" aria-hidden="true"></i>
                </button>
                <output class="image-lightbox-scale" data-lightbox-scale aria-live="polite">100%</output>
                <button type="button" data-lightbox-action="zoom-in" aria-label="Zoom in" title="Zoom in">
                    <i class="fa fa-search-plus" aria-hidden="true"></i>
                </button>
                <button type="button" data-lightbox-action="reset" aria-label="Reset zoom" title="Reset zoom">
                    <i class="fa fa-undo" aria-hidden="true"></i>
                </button>
                <button type="button" class="image-lightbox-close" data-lightbox-action="close" aria-label="Close image preview" title="Close image preview">
                    <i class="fa fa-times" aria-hidden="true"></i>
                </button>
            </div>
        </header>
        <div class="image-lightbox-viewport" data-lightbox-viewport tabindex="0" aria-label="Zoomed image viewport">
            <img data-lightbox-image alt="" draggable="false">
        </div>
    </section>
</div>
