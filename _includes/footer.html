<footer class="site-footer">
    <div class="footer-identity">
        <a href="{{ site.baseurl }}/">NAB / Engineering notes</a>
        <span>&copy; {{ site.time | date: "%Y" }}</span>
    </div>
    <nav aria-label="Social links">
        {% if site.github_username %}
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer">GitHub</a>
        {% endif %}
        {% if site.linkedin_username %}
        <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        {% endif %}
        {% if site.email %}
        <a href="mailto:{{ site.email }}">Email</a>
        {% endif %}
        <a href="{{ site.baseurl }}/profile/">Profile</a>
    </nav>
</footer>

<script src="{{ "/js/simple-jekyll-search.min.js" | prepend: site.baseurl }}"></script>

{% if site.service-worker %}
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('{{ "/sw.js" | prepend: site.baseurl }}').catch(function () {});
    }
</script>
{% endif %}

{% if page.catalog %}
<script>
    (function () {
        var catalog = document.querySelector('.catalog-body');
        if (!catalog) return;

        document.querySelectorAll('.post-container h2, .post-container h3, .post-container h4').forEach(function (heading) {
            if (!heading.id) return;
            var item = document.createElement('li');
            item.className = heading.tagName.toLowerCase();
            var link = document.createElement('a');
            link.href = '#' + heading.id;
            link.textContent = heading.textContent;
            item.appendChild(link);
            catalog.appendChild(item);
        });
    })();
</script>
{% endif %}

<script>
    function htmlDecode(input) {
        var element = document.createElement('textarea');
        element.innerHTML = input;
        return element.childNodes.length === 0 ? '' : element.childNodes[0].nodeValue;
    }

    var searchInput = document.getElementById('search-input');
    var searchResults = document.getElementById('search-results');
    if (window.SimpleJekyllSearch && searchInput && searchResults) {
        SimpleJekyllSearch({
            searchInput: searchInput,
            resultsContainer: searchResults,
            json: '{{ "/search.json" | prepend: site.baseurl }}',
            searchResultTemplate: '<a class="search-result" href="{url}"><strong>{title}</strong><span>{subtitle}</span></a>',
            noResultsText: '<p class="search-empty">No matching notes found.</p>',
            limit: 20,
            fuzzy: false,
            templateMiddleware: function (prop, value) {
                return prop === 'subtitle' || prop === 'title' ? htmlDecode(String(value || '')) : value;
            }
        });
    }

    (function () {
        var searchPage = document.querySelector('.search-page');
        var searchOpen = document.querySelector('.search-icon');
        var searchClose = document.querySelector('.search-icon-close');
        var searchField = document.getElementById('search-input');
        var previousFocus = null;
        var focusAttempts = 0;

        if (!searchPage || !searchOpen || !searchClose || !searchField) return;

        function focusSearchField() {
            if (!searchPage.classList.contains('search-active')) return;
            if (window.getComputedStyle(searchField).visibility === 'visible') {
                searchField.select();
                return;
            }
            focusAttempts += 1;
            if (focusAttempts < 30) window.requestAnimationFrame(focusSearchField);
        }

        function openSearch() {
            previousFocus = document.activeElement;
            searchPage.classList.add('search-active');
            searchPage.setAttribute('aria-hidden', 'false');
            searchField.setAttribute('tabindex', '0');
            document.body.classList.add('no-scroll');
            focusAttempts = 0;
            window.requestAnimationFrame(focusSearchField);
        }

        function closeSearch() {
            searchPage.classList.remove('search-active');
            searchPage.setAttribute('aria-hidden', 'true');
            searchField.setAttribute('tabindex', '-1');
            document.body.classList.remove('no-scroll');
            var previousFocusVisible = previousFocus
                && previousFocus.offsetParent !== null
                && window.getComputedStyle(previousFocus).visibility === 'visible';
            if (previousFocusVisible) {
                previousFocus.focus();
            } else {
                var menuToggle = document.querySelector('.site-nav-toggle');
                if (menuToggle) menuToggle.focus();
            }
        }

        function getFocusableElements() {
            return Array.prototype.filter.call(
                searchPage.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])'),
                function (element) {
                    return element.offsetParent !== null && window.getComputedStyle(element).visibility === 'visible';
                }
            );
        }

        searchOpen.addEventListener('click', openSearch);
        searchClose.addEventListener('click', closeSearch);
        searchPage.addEventListener('click', function (event) {
            if (event.target === searchPage) closeSearch();
        });
        document.addEventListener('keydown', function (event) {
            if (!searchPage.classList.contains('search-active')) return;
            if (event.key === 'Escape') {
                closeSearch();
                return;
            }
            if (event.key !== 'Tab') return;

            var focusable = getFocusableElements();
            if (!focusable.length) return;
            var first = focusable[0];
            var last = focusable[focusable.length - 1];

            if (!searchPage.contains(document.activeElement)) {
                event.preventDefault();
                first.focus();
            } else if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                first.focus();
            }
        });
    })();

    (function () {
        document.querySelectorAll('[data-smart-back]').forEach(function (link) {
            link.addEventListener('click', function (event) {
                if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
                if (!document.referrer || window.history.length < 2) return;

                try {
                    if (new URL(document.referrer).origin !== window.location.origin) return;
                    event.preventDefault();
                    window.history.back();
                } catch (error) {
                    return;
                }
            });
        });
    })();
</script>
