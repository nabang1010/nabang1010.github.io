{% assign card_post = include.post %}
{% assign card_tag = card_post.tags | first | default: card_post.section | default: "Note" %}
<article class="post-card {{ include.tone | strip }}">
    <a class="post-card-link" href="{{ card_post.url | prepend: site.baseurl }}">
        <div class="post-card-meta">
            <span>{{ card_tag }}</span>
            <time datetime="{{ card_post.date | date_to_xmlschema }}">{{ card_post.date | date: "%B, %-d" }}</time>
        </div>
        <h2>{{ card_post.title }}</h2>
        <span class="post-card-arrow" aria-hidden="true">&rarr;</span>
    </a>
</article>
