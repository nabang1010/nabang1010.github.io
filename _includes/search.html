<div class="search-page" role="dialog" aria-modal="true" aria-label="Search articles" aria-hidden="true">
    <div class="search-toolbar">
        <span>/ Search archive</span>
        <button type="button" class="search-icon-close" aria-label="Close search">
            <i class="fa fa-times" aria-hidden="true"></i>
        </button>
    </div>
    <div class="search-main">
        <form class="search-form" action="{{ site.baseurl }}/search.json" method="get" onsubmit="return false;">
            <label for="search-input">What are you looking for?</label>
            <input type="search" id="search-input" placeholder="Type to search..." autocomplete="off" tabindex="-1">
        </form>
        <div id="search-results" class="search-results" aria-label="Search results" aria-live="polite"></div>
    </div>
</div>
