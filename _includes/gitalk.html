{% if site.gitalk.enable and site.gitalk.clientID and site.gitalk.clientSecret %}
<div id="gitalk-container"></div>
<script src="{{ '/js/md5.min.js' | prepend: site.baseurl }}"></script>
<script>
    (function () {
        if (typeof Gitalk === 'undefined') return;

        var gitalkId = {% if include.id %}'{{ include.id }}'{% else %}md5(window.location.pathname){% endif %};
        var gitalk = new Gitalk({
            clientID: '{{ site.gitalk.clientID }}',
            clientSecret: '{{ site.gitalk.clientSecret }}',
            repo: '{{ site.gitalk.repo }}',
            owner: '{{ site.gitalk.owner }}',
            admin: ['{{ site.gitalk.admin }}'],
            distractionFreeMode: {{ site.gitalk.distractionFreeMode }},
            id: gitalkId
        });

        gitalk.render('gitalk-container');
    })();
</script>
{% endif %}
