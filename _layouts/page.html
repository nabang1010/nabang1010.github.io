---
layout: default
---

<div class="reader-toolbar">
    <div class="reader-toolbar-inner">
        <a href="{{ site.baseurl }}/" aria-label="Go to home page"><span aria-hidden="true">&larr;</span> Home</a>
    </div>
</div>

<section class="reader-canvas page-reader">
    <div class="page-column">
        <header class="page-heading">
            <div class="page-meta">
                <span>{{ page.section | default: "Profile" }}</span>
                <span>NAB / {{ site.time | date: "%Y" }}</span>
            </div>
            <h1>{% if page.hero-title %}{{ page.hero-title }}{% else %}{{ page.title }}{% endif %}</h1>
            {% if page.description %}
            <p>{{ page.description }}</p>
            {% endif %}
        </header>
        <div class="page-content">
            {{ content }}
        </div>
    </div>
    <aside class="reader-nav">
        {% include nav.html %}
    </aside>
</section>
