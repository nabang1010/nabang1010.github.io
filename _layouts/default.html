<!DOCTYPE html>
<html lang="vi">

{% include head.html %}

<body class="layout-{{ page.layout | default: 'default' }} page-{{ page.title | default: 'home' | slugify }}">

<div class="page-frame">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% unless page.layout == "post" or page.layout == "page" %}
    {% include nav.html %}
    {% endunless %}
    {% include search.html %}

    <main id="main-content" tabindex="-1">
        {{ content }}
    </main>

    <button class="back-to-top" type="button" aria-label="Back to top" aria-hidden="true" tabindex="-1" title="Back to top">
        <span aria-hidden="true">&uarr;</span>
    </button>

    {% include footer.html %}
</div>

</body>

</html>
